server.port=${PORT:8080}
aarchgate.grpc.host=${AARCHGATE_CORE_HOST:127.0.0.1}
aarchgate.grpc.port=${AARCHGATE_CORE_PORT:50052}
aarchgate.scratch.dir=${AARCHGATE_SCRATCH_DIR:scratch}
aarchgate.scratch.max-size-gb=${AARCHGATE_MAX_CACHE_GB:10}

# Kafka Ingestion Config
kafka.enabled=${KAFKA_ENABLED:false}
kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
kafka.topic=${KAFKA_TOPIC:app-logs}
kafka.group-id=${KAFKA_GROUP_ID:aarchgate-ingest}
kafka.batch-size=${KAFKA_BATCH_SIZE:5000}
kafka.flush-interval-ms=${KAFKA_FLUSH_INTERVAL:500}
aarchgate.database-path=${AARCHGATE_DB_PATH:benchmark_native_scan.agb}
